experiment: unet_baseline
mode: stage_a
seed: 20260716
device: auto
require_cuda: true
output_root: runs

data:
  fixed_root: ../data/fixed_composite_dataset_v2_gain18_lower
  m_root: ../data/M
  r2_root: ../data/R2
  r1_root: ../data/R1
  source_splits: ../data/fixed_composite_dataset_v2_gain18_lower/source_splits.json
  r1_window_manifest: null
  debug_crop_size: null

loader:
  batch_size: 8
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  horizontal_flip: true

model:
  method: unet
  in_channels: 1
  channels: [32, 64, 128, 256]
  blocks_per_level: 2
  dropout: 0.0
  group_norm_groups: 8
  use_checkpoint: true

loss:
  target_weight_kappa: 4.0
  lambda_rec: 1.0
  lambda_dir: 0.2
  lambda_prior: 0.0
  lambda_empty: 0.2

optimizer:
  name: adamw
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.999]

training:
  epochs: 100
  max_hours: 24
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  ema_decay: 0.9999
  val_every: 5
  save_every: 5
  patience_evaluations: 3
  max_steps_per_epoch: null

evaluation:
  batch_size: 1
  max_composite_samples: null
  max_empty_samples: null
  pfr_threshold: 0.1
  baseline_metrics_json: null
  empty_tolerance: 1.05
  save_predictions: true