experiment: smoke
mode: stage_a
seed: 20260716
device: cpu
require_cuda: false
output_root: runs

data:
  fixed_root: ../data/fixed_composite_dataset_v2_gain18_lower
  m_root: ../data/M
  r2_root: ../data/R2
  r1_root: ../data/R1
  source_splits: ../data/fixed_composite_dataset_v2_gain18_lower/source_splits.json
  r1_window_manifest: null
  debug_crop_size: 64

loader:
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  horizontal_flip: false

model:
  method: dg_rtdiff
  in_channels: 1
  channels: [8, 16, 32, 64]
  blocks_per_level: 1
  dropout: 0.0
  time_dim: 32
  group_norm_groups: 8
  use_checkpoint: false
  bottleneck_attention: false
  horizontal_kernel: 15

diffusion:
  timesteps: 16
  schedule: cosine
  sampling_steps: 2
  eta: 0.0
  clip_x0: 2.0

loss:
  target_weight_kappa: 4.0
  lambda_rec: 1.0
  lambda_dir: 0.2
  lambda_prior: 0.1
  lambda_empty: 0.2
  mil_top_fraction: 0.1

optimizer:
  name: adamw
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.999]

training:
  epochs: 1
  max_hours: 0.1
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  amp: false
  amp_dtype: float32
  ema_decay: 0.9
  val_every: 1
  save_every: 1
  patience_evaluations: 1
  max_steps_per_epoch: 1
  freeze_denoiser_epochs: 0

evaluation:
  batch_size: 1
  max_composite_samples: 2
  max_empty_samples: 2
  pfr_threshold: 0.1
  baseline_metrics_json: null
  empty_tolerance: 1.05
  save_predictions: false